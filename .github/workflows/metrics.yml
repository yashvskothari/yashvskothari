name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg

          token: ${{ secrets.metrics_token }}

          user: yashvskothari

          template: classic
          base: header, activity, community, repositories, metadata

          plugin_code: yes
          plugin_code_days: 14

          plugin_followup: yes

          plugin_isocalendar: yes

          plugin_languages: yes
          plugin_languages_limit: 8

          plugin_topics: yes

          plugin_lines: yes

          plugin_traffic: yes
